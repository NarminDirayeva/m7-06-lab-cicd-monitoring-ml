name: Deploy Vision Moderation Model

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ─────────────────────────────────────────
  # Stage 1: Lint
  # ─────────────────────────────────────────
  lint:
    name: Lint (OpenAPI + Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint OpenAPI spec
        uses: stoplightio/spectral-action@v0.8.11
        with:
          file_glob: "openapi*.yml"

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ─────────────────────────────────────────
  # Stage 2: Test
  # ─────────────────────────────────────────
  test:
    name: Unit + Contract Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: ./scripts/test-unit.sh

      - name: Run contract tests
        run: ./scripts/test-contract.sh

  # ─────────────────────────────────────────
  # Stage 3: Build
  # ─────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      git-sha: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=

      - name: Build (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ─────────────────────────────────────────
  # Stage 4: Scan
  # ─────────────────────────────────────────
  scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # ─────────────────────────────────────────
  # Stage 5: Push
  # ─────────────────────────────────────────
  push:
    name: Push Image to GHCR
    runs-on: ubuntu-latest
    needs: scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ─────────────────────────────────────────
  # Stage 6: Deploy to Staging
  # ─────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.vision-moderation.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy manifests to staging
        run: ./scripts/deploy.sh staging ${{ github.sha }}
        env:
          KUBECONFIG_DATA: ${{ secrets.STAGING_KUBECONFIG }}

  # ─────────────────────────────────────────
  # Stage 7: Smoke Test Staging
  # ─────────────────────────────────────────
  smoke-staging:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests against staging
        run: ./scripts/smoke.sh staging
        env:
          SMOKE_TARGET_URL: https://staging.vision-moderation.example.com

  # ─────────────────────────────────────────
  # Stage 8: Deploy to Production (canary)
  # ─────────────────────────────────────────
  deploy-production:
    name: Deploy to Production (Canary → Full)
    runs-on: ubuntu-latest
    needs: smoke-staging
    environment:
      name: production
      url: https://vision-moderation.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canary rollout — 10%
        run: ./scripts/deploy.sh production ${{ github.sha }} --canary=10
        env:
          KUBECONFIG_DATA: ${{ secrets.PROD_KUBECONFIG }}

      - name: Verify canary health
        run: ./scripts/canary-verify.sh production ${{ github.sha }}
        env:
          KUBECONFIG_DATA: ${{ secrets.PROD_KUBECONFIG }}
          CANARY_VERIFY_TIMEOUT: "300"

      - name: Full rollout — 100%
        run: ./scripts/deploy.sh production ${{ github.sha }} --canary=100
        env:
          KUBECONFIG_DATA: ${{ secrets.PROD_KUBECONFIG }}
